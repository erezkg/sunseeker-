<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sunseeker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#ffffff; --card:rgba(255,255,255,.86); --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.1); --shadow:0 8px 30px rgba(0,0,0,.14);
    /* Mondrian palette, by cloud level */
    --b0:#d92b1c; --b1:#f6cf1a; --b2:#ffffff; --b3:#ffffff; --b4:#1d4f9f;
  }
  @media (prefers-color-scheme:dark){:root{
    --card:rgba(30,32,38,.86); --ink:#f5f5f7; --muted:#a1a1a8; --line:rgba(255,255,255,.12); --shadow:0 8px 30px rgba(0,0,0,.5);
  }}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#fff;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #map{position:absolute;inset:0;background:#fff}
  .glass{background:var(--card);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid var(--line);box-shadow:var(--shadow)}

  #status{position:absolute;z-index:1000;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;max-width:420px;
    border-radius:20px;padding:14px 16px;display:flex;gap:14px;align-items:center}
  #status .ico{flex:none;width:46px;height:46px;border-radius:6px;display:grid;place-items:center;background:var(--c);border:2px solid #111}
  #status .ico svg{width:26px;height:26px}
  .ico.b0,.ico.b4{color:#fff}.ico.b1,.ico.b2,.ico.b3{color:#1d1d1f}
  .b0{--c:var(--b0)}.b1{--c:var(--b1)}.b2{--c:var(--b2)}.b3{--c:var(--b3)}.b4{--c:var(--b4)}
  #status h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
  #status p{margin:2px 0 0;font-size:13.5px;color:var(--muted);line-height:1.35}
  #status>*{animation:fadein .35s ease backwards}
  .spin{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  @keyframes fadein{from{opacity:0}}

  #days{position:absolute;z-index:1000;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);
    max-width:520px;border-radius:999px;padding:5px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
  #days::-webkit-scrollbar{display:none}
  #days button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13.5px;font-weight:550;
    padding:9px 14px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
  #days button.on{background:#111;color:#fff}

  #locate{position:absolute;z-index:1000;right:12px;bottom:calc(env(safe-area-inset-bottom) + 128px);width:46px;height:46px;
    border-radius:50%;display:grid;place-items:center;color:var(--ink);cursor:pointer;padding:0}
  #locate svg{width:22px;height:22px}
  #locate.busy svg{animation:pulse 1s ease-in-out infinite}
  #legend{position:absolute;z-index:1000;right:12px;bottom:calc(env(safe-area-inset-bottom) + 78px);border-radius:14px;
    padding:8px 11px;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
  #legend span{display:flex;align-items:center;gap:4px}
  #legend i{width:14px;height:14px;display:inline-block;background:var(--c);border:1.5px solid #111}

  .city{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;white-space:nowrap;pointer-events:none;
    background:rgba(255,255,255,.94);border:1.5px solid #111;border-radius:4px;padding:2px 6px;font:600 11.5px/1.3 system-ui,sans-serif;color:#111}
  .city i{width:9px;height:9px;background:var(--c);border:1.5px solid #111;flex:none}
  .city b{font-weight:500;color:#555}
  .pin{width:20px;height:20px;border-radius:50%;background:#111;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .leaflet-control-attribution{background:rgba(255,255,255,.85)!important;color:#555!important;font-size:10px;border-radius:8px 0 0 0}
  .leaflet-tooltip,.leaflet-popup-content-wrapper{border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--shadow);font:600 12px system-ui}
  .leaflet-popup-content{margin:9px 12px;line-height:1.4}
  .leaflet-popup-tip{background:var(--card)}
  .leaflet-tooltip:before{display:none}
  @media (prefers-reduced-motion:reduce){#status>*{animation:none}}
</style>
</head>
<body>
<div id="map"></div>
<div id="status" class="glass"></div>
<div id="legend" class="glass"></div>
<button id="locate" class="glass" aria-label="Centre on my location"></button>
<div id="days" class="glass"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const SPACING_PX = 72;   // weather points sit on a fixed lat/lng lattice, about this far apart on screen
const STEPS = [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20]; // lattice spacings in degrees
const KEEP_MS = 90 * 60e3; // reuse fetched weather this long, so panning and reloading cost no API calls
const SUNNY = 25;        // % cloud cover at or below which a spot counts as sunny

const svg = body => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
const ICONS = {
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>'),
  part: svg('<path d="M12 2v2M4.93 4.93l1.41 1.41M20 12h2M19.07 4.93l-1.41 1.41M15.947 12.65a4 4 0 0 0-5.925-4.128M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/>'),
  cloud: svg('<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>'),
  locate: svg('<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/>'),
};
const level = c => c <= 10 ? 0 : c <= SUNNY ? 1 : c <= 45 ? 2 : c <= 70 ? 3 : 4;
const iconFor = lv => lv <= 1 ? ICONS.sun : lv === 2 || lv === 3 ? ICONS.part : ICONS.cloud;

const MAX_ZOOM = 16;     // deeper than this the base map is all house numbers and footpaths
const map = L.map('map', {zoomControl: false, maxZoom: MAX_ZOOM}).setView([0, 0], 2);
const layer = L.layerGroup().addTo(map);   // pin, nearest-sun marker
const cityLayer = L.layerGroup().addTo(map); // city name labels
const statusEl = document.getElementById('status');
let me = null, sel = 0, loadId = 0, timer = null, staleNote = '';

document.getElementById('legend').innerHTML =
  `<span><i class="b0"></i><i class="b1"></i>Sunny</span><span><i class="b2"></i>Mixed</span><span><i class="b4"></i>Cloudy</span>`;

function km(a, b) {
  const r = Math.PI / 180, dLat = (b[0]-a[0])*r, dLon = (b[1]-a[1])*r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLon/2)**2;
  return 12742 * Math.asin(Math.sqrt(h));
}

// ---------------------------------------------------------------------------------------------
// The map itself: OSM tiles redrawn in a Mondrian style. Streets turn black, and every building,
// park or plot is filled red / yellow (sunny) or blue (cloudy) according to the weather there.
// ---------------------------------------------------------------------------------------------
const N = 512;                                  // pixels per tile (2x, built from four tiles one zoom deeper)
const pack = (r, g, b) => ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
const PAPER = pack(255, 255, 255), LINE = pack(17, 17, 17), WATER = pack(186, 214, 243);
const RED = pack(217, 43, 28), YELLOW = pack(240, 195, 20), BLUE = pack(29, 79, 159);

function hash3(a, b, c) {
  let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x7f4a7c15, 0xc2b2ae35) ^ Math.imul(c + 0x165667b1, 0x27d4eb2f);
  h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h = Math.imul(h, 0x297a2d39); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}

// ---- weather store: points on a fixed lat/lng lattice, cached so panning only fetches what is new ----
const wx = new Map();                 // "step:i:j" -> {now, day, daily[], t}; point (i, j) sits at lng i*step, lat j*step
let stepDeg = 0.1, dayList = [], selFrom = 0, selTo = 0, mix = 1;   // selFrom -> selTo is the day-switch blend
const wkey = (s, i, j) => `${s}:${i}:${j}`;
const pval = (p, k) => k === 0 ? p.now : p.daily[k - 1];
const fresh = k => { const p = wx.get(k); return !!p && Date.now() - p.t < KEEP_MS; };

function pickStep() {
  const need = SPACING_PX * 360 / (256 * 2 ** map.getZoom());
  return STEPS.find(s => s >= need) || STEPS[STEPS.length - 1];
}

function wxVal(s, i, j) {
  const p = wx.get(wkey(s, i, j)); if (!p) return null;
  const a = pval(p, selFrom), b = pval(p, selTo);
  return a + (b - a) * mix;
}

// bilinear cloud cover between the surrounding lattice points at one spacing (ignoring ones not fetched)
function bilinear(s, lat, lng) {
  const fi = lng / s, fj = lat / s, i0 = Math.floor(fi), j0 = Math.floor(fj), tx = fi - i0, ty = fj - j0;
  let sum = 0, wsum = 0;
  for (const [di, dj, w] of [[0, 0, (1 - tx) * (1 - ty)], [1, 0, tx * (1 - ty)], [0, 1, (1 - tx) * ty], [1, 1, tx * ty]]) {
    const v = wxVal(s, i0 + di, j0 + dj);
    if (v != null && w > 0) { sum += v * w; wsum += w; }
  }
  return wsum > 0 ? sum / wsum : null;
}

// cloud cover anywhere; falls back to another lattice spacing while a fresh one is loading
function cloudLL(lat, lng) {
  const order = [stepDeg, ...STEPS.filter(s => s !== stepDeg).sort((a, b) => Math.abs(Math.log(a / stepDeg)) - Math.abs(Math.log(b / stepDeg)))];
  for (const s of order) { const v = bilinear(s, lat, lng); if (v != null) return v; }
  return null;
}

// cloud % at a point given in pixels of zoom z (global pixel coordinates)
function cloudAtGlobal(gx, gy, z) {
  if (!wx.size) return null;
  const ll = map.unproject(L.point(gx, gy), z);
  return cloudLL(ll.lat, ll.lng);
}

// the lattice points inside the current view, with the chosen day's value
function viewPoints() {
  const b = map.getBounds(), s = stepDeg, out = [];
  for (let i = Math.ceil(b.getWest() / s); i <= Math.floor(b.getEast() / s); i++)
    for (let j = Math.ceil(b.getSouth() / s); j <= Math.floor(b.getNorth() / s); j++) {
      const p = wx.get(wkey(s, i, j));
      if (p) out.push({pos: [j * s, i * s], cloud: pval(p, sel), day: p.day});
    }
  return out;
}

const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// fill colour of one feature: under heavy cloud nearly everything is blue, under clear sky nearly everything
// yellow or red; only mixed skies leave most features paper-white
function featureColor(v, classKey, kx, ky) {
  if (v == null) return PAPER;
  const u = hash3(classKey, kx, ky), t = v / 100;
  const pB = .95 * smooth(.4, .8, t), pSun = .95 * (1 - smooth(.2, .6, t));   // mirror images around 50%
  return u < pB ? BLUE : u < pB + pSun * .7 ? YELLOW : u < pB + pSun ? RED : PAPER;
}

// the paper itself takes a flat wash, like a Mondrian plane: cream where it is sunny, pale blue where it is
// overcast, white in between; the edges between them are short so each reads as one colour
function paperTint(v) {
  if (v == null) return PAPER;
  const t = v / 100, sun = 1 - smooth(.3, .4, t), cloud = smooth(.6, .7, t);
  const mix = (a, b, k) => Math.round(a + (b - a) * k);
  return pack(mix(mix(255, 255, sun), 208, cloud), mix(mix(255, 243, sun), 222, cloud), mix(mix(255, 208, sun), 243, cloud));
}

// OSM road fills (motorway, trunk, primary, secondary); their casings are the only strongly saturated colours on the map
const ROAD_FILLS = [[232, 146, 162], [249, 178, 156], [252, 214, 164], [247, 250, 191]];

// sort every pixel of an OSM tile into paper / street line / water / feature fill
function classify(px, z) {
  const cls = new Uint8Array(N * N), key = new Uint16Array(N * N);
  for (let i = 0; i < N * N; i++) {
    const r = px[i*4], g = px[i*4+1], b = px[i*4+2], a = px[i*4+3];
    if (a < 200) continue;
    if (Math.abs(r - 170) < 14 && Math.abs(g - 211) < 12 && Math.abs(b - 223) < 12) { cls[i] = 2; continue; }
    if (Math.abs(r - g) < 5 && Math.abs(g - b) < 5) { cls[i] = r >= 105 && r <= 205 ? 1 : 0; continue; } // grey casing = street, rest paper
    const sat = Math.max(r, g, b) - Math.min(r, g, b);
    if (sat >= 85 || ROAD_FILLS.some(([R, G, B]) => Math.abs(r - R) < 10 && Math.abs(g - G) < 10 && Math.abs(b - B) < 10)) { cls[i] = 1; continue; } // road casings and fills
    if (Math.abs(r - 242) < 7 && Math.abs(g - 239) < 7 && Math.abs(b - 233) < 8) continue;                 // plain land
    if (Math.min(r, g, b) >= 228) continue;                                                                 // pale anti-aliasing fringes stay paper
    cls[i] = 3; key[i] = ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
  }
  dropSpecks(cls, z);
  return {cls, key};
}

// keep only the street network: compact bits of line (letters of labels, house numbers, dashes of footpaths
// and boundaries) are wiped back to paper; street edges are long and thin, so they survive
function dropSpecks(cls, z) {
  const minLen = z >= 16 ? 30 : 14;   // deep tiles carry house numbers and street names; shallower ones have short street segments
  const seen = new Uint8Array(N * N), stack = new Int32Array(N * N), comp = new Int32Array(N * N);
  for (let s = 0; s < N * N; s++) {
    if (cls[s] !== 1 || seen[s]) continue;
    let sp = 0, n = 0, x0 = N, x1 = 0, y0 = N, y1 = 0;
    stack[sp++] = s; seen[s] = 1;
    while (sp) {
      const i = stack[--sp], x = i & (N - 1), y = i >> 9;
      comp[n++] = i;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (const j of [x > 0 ? i - 1 : -1, x < N - 1 ? i + 1 : -1, y > 0 ? i - N : -1, y < N - 1 ? i + N : -1])
        if (j >= 0 && cls[j] === 1 && !seen[j]) { seen[j] = 1; stack[sp++] = j; }
    }
    const edge = x0 === 0 || y0 === 0 || x1 === N - 1 || y1 === N - 1;
    if (Math.max(x1 - x0, y1 - y0) < (edge ? 8 : minLen)) for (let k = 0; k < n; k++) cls[comp[k]] = 0;
  }
}

// connected patches of the same fill colour
function label(cls, key) {
  const lab = new Int32Array(N * N).fill(-1), cx = [], cy = [], area = [], border = [], ck = [], stack = new Int32Array(N * N);
  for (let s = 0; s < N * N; s++) {
    if (cls[s] !== 3 || lab[s] >= 0) continue;
    const id = area.length, kk = key[s];
    let n = 0, ax = 0, ay = 0, edge = false, sp = 0;
    stack[sp++] = s; lab[s] = id;
    while (sp) {
      const i = stack[--sp], x = i & (N - 1), y = i >> 9;
      n++; ax += x; ay += y;
      if (x === 0 || y === 0 || x === N - 1 || y === N - 1) edge = true;
      if (x > 0 && lab[i-1] < 0 && cls[i-1] === 3 && key[i-1] === kk) { lab[i-1] = id; stack[sp++] = i - 1; }
      if (x < N-1 && lab[i+1] < 0 && cls[i+1] === 3 && key[i+1] === kk) { lab[i+1] = id; stack[sp++] = i + 1; }
      if (y > 0 && lab[i-N] < 0 && cls[i-N] === 3 && key[i-N] === kk) { lab[i-N] = id; stack[sp++] = i - N; }
      if (y < N-1 && lab[i+N] < 0 && cls[i+N] === 3 && key[i+N] === kk) { lab[i+N] = id; stack[sp++] = i + N; }
    }
    cx.push(ax / n); cy.push(ay / n); area.push(n); border.push(edge); ck.push(kk);
  }
  return {lab, cx, cy, area, border, ck};
}

// pieces of bare paper between streets, coast and features; each takes one flat wash so the wash follows the map
function labelPaper(cls) {
  const plab = new Int32Array(N * N).fill(-1), pcx = [], pcy = [], parea = [], pedge = [], stack = new Int32Array(N * N);
  for (let s = 0; s < N * N; s++) {
    if (cls[s] !== 0 || plab[s] >= 0) continue;
    const id = parea.length;
    let n = 0, ax = 0, ay = 0, sp = 0, edge = false;
    stack[sp++] = s; plab[s] = id;
    while (sp) {
      const i = stack[--sp], x = i & (N - 1), y = i >> 9;
      n++; ax += x; ay += y;
      if (x === 0 || y === 0 || x === N - 1 || y === N - 1) edge = true;
      if (x > 0 && plab[i-1] < 0 && cls[i-1] === 0) { plab[i-1] = id; stack[sp++] = i - 1; }
      if (x < N-1 && plab[i+1] < 0 && cls[i+1] === 0) { plab[i+1] = id; stack[sp++] = i + 1; }
      if (y > 0 && plab[i-N] < 0 && cls[i-N] === 0) { plab[i-N] = id; stack[sp++] = i - N; }
      if (y < N-1 && plab[i+N] < 0 && cls[i+N] === 0) { plab[i+N] = id; stack[sp++] = i + N; }
    }
    pcx.push(ax / n); pcy.push(ay / n); parea.push(n); pedge.push(edge);
  }
  return {plab, pcx, pcy, parea, pedge};
}

const HUGE = 30000;   // patches bigger than this are split into 128px cells so open land is not one flat slab

function paintTile(canvas) {
  const st = canvas._st; if (!st) return;
  const {cls, lab, cx, cy, area, border, ck} = st, z = st.z, ox = st.x * 256, oy = st.y * 256;
  const cols = new Uint32Array(area.length), huge = [];
  for (let l = 0; l < area.length; l++) {
    if (area[l] < 14) { cols[l] = PAPER; continue; }    // label text and anti-aliasing crumbs
    const gx = ox + cx[l] / 2, gy = oy + cy[l] / 2;
    if (area[l] > HUGE) {
      const cells = new Uint32Array(16);
      for (let c = 0; c < 16; c++) {
        const px = (c & 3) * 128 + 64, py = (c >> 2) * 128 + 64;
        cells[c] = featureColor(cloudAtGlobal(ox + px / 2, oy + py / 2, z), ck[l], st.x * 4 + (c & 3), st.y * 4 + (c >> 2));
      }
      huge[l] = cells; continue;
    }
    // patches that touch a tile edge may continue in the neighbour tile, so they take a colour from a coarse shared cell
    cols[l] = border[l]
      ? featureColor(cloudAtGlobal(gx, gy, z), ck[l], Math.floor(gx / 1024), Math.floor(gy / 1024))
      : featureColor(cloudAtGlobal(gx, gy, z), ck[l], Math.round(gx * 4), Math.round(gy * 4));
  }
  // wash: one flat tint per piece of paper (or per unpainted feature); pieces cut by the tile edge, and open
  // country too big to be one piece, use 16px blocks so neighbouring tiles agree
  const {plab, pcx, pcy, parea, pedge} = st;
  const ptint = new Uint32Array(parea.length), ftint = new Uint32Array(area.length);
  for (let p = 0; p < parea.length; p++) ptint[p] = parea[p] > HUGE || pedge[p] ? 0 : paperTint(cloudAtGlobal(ox + pcx[p] / 2, oy + pcy[p] / 2, z));
  for (let l = 0; l < area.length; l++) if (cols[l] === PAPER) ftint[l] = paperTint(cloudAtGlobal(ox + cx[l] / 2, oy + cy[l] / 2, z));
  const tint = new Uint32Array(1024);
  for (let b = 0; b < 1024; b++) tint[b] = paperTint(cloudAtGlobal(ox + ((b & 31) * 16 + 8) / 2, oy + ((b >> 5) * 16 + 8) / 2, z));
  const ctx = canvas.getContext('2d'), img = ctx.createImageData(N, N), out = new Uint32Array(img.data.buffer);
  for (let i = 0; i < N * N; i++) {
    const c = cls[i];
    let col = c === 1 ? LINE : c === 2 ? WATER : c === 3 ? (huge[lab[i]] ? huge[lab[i]][(((i >> 9) >> 7) << 2) | ((i & 511) >> 7)] : cols[lab[i]]) : PAPER;
    if (col === PAPER) col = (c === 0 && ptint[plab[i]]) || (c === 3 && !huge[lab[i]] && ftint[lab[i]]) || tint[((i >> 13) << 5) | ((i & 511) >> 4)];
    out[i] = col;
  }
  ctx.putImageData(img, 0, 0);
}

function loadTile(z, x, y) {
  return new Promise(res => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => res(im); im.onerror = () => res(null);
    const n = 2 ** z;
    im.src = `https://tile.openstreetmap.org/${z}/${((x % n) + n) % n}/${y}.png`;
  });
}

const SunTiles = L.GridLayer.extend({
  createTile(coords, done) {
    const canvas = document.createElement('canvas'); canvas.width = canvas.height = N;
    const src = document.createElement('canvas'); src.width = src.height = N;
    const sctx = src.getContext('2d', {willReadFrequently: true});
    const deep = coords.z < MAX_ZOOM;          // use the next zoom level for double resolution (stops before house numbers)
    const jobs = deep
      ? [0, 1, 2, 3].map(k => loadTile(coords.z + 1, coords.x * 2 + (k & 1), coords.y * 2 + (k >> 1)).then(im => im && sctx.drawImage(im, (k & 1) * 256, (k >> 1) * 256)))
      : [loadTile(coords.z, coords.x, coords.y).then(im => im && sctx.drawImage(im, 0, 0, N, N))];
    Promise.all(jobs).then(() => {
      try {
        const {cls, key} = classify(sctx.getImageData(0, 0, N, N).data, deep ? coords.z + 1 : coords.z);
        canvas._st = Object.assign({cls, z: coords.z, x: coords.x, y: coords.y}, label(cls, key), labelPaper(cls));
        paintTile(canvas);
      } catch (e) { canvas.getContext('2d').drawImage(src, 0, 0); } // pixels unreadable: show the plain map
      done(null, canvas);
    });
    return canvas;
  }
});
const tiles = new SunTiles({tileSize: 256, maxZoom: MAX_ZOOM, attribution: '© OpenStreetMap, weather © Open-Meteo'}).addTo(map);
const repaintAll = () => Object.values(tiles._tiles).forEach(t => t.el && t.el._st && paintTile(t.el));

// switch day, blending from the old one so squares flip across the map
let tween = 0;
function applySel(animate, done) {
  cancelAnimationFrame(tween);
  const from = selTo;
  if (!animate || from === sel || matchMedia('(prefers-reduced-motion: reduce)').matches) { selFrom = selTo = sel; mix = 1; repaintAll(); done(); return; }
  selFrom = from; selTo = sel; mix = 0;
  const t0 = performance.now(), D = 750;
  const frame = now => {
    const t = Math.min(1, (now - t0) / D);
    mix = t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
    repaintAll();
    if (t < 1) tween = requestAnimationFrame(frame); else { selFrom = selTo = sel; mix = 1; done(); }
  };
  tween = requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------------------------------
function say(lv, title, text, busy) {
  statusEl.innerHTML = `<div class="ico b${lv}">${iconFor(lv)}</div>
    <div><h1 class="${busy ? 'spin' : ''}">${title}</h1><p>${text}</p></div>`;
}

function buildChips() {
  const days = dayList;
  const el = document.getElementById('days');
  el.innerHTML = '';
  ['Now', ...days.map((d, i) => i === 0 ? 'Today' : i === 1 ? 'Tomorrow' :
    new Date(d + 'T12:00').toLocaleDateString(undefined, {weekday: 'short'}))].forEach((t, i) => {
    const b = document.createElement('button');
    b.textContent = t; b.className = i === sel ? 'on' : '';
    b.onclick = () => { if (i === sel) return; sel = i; buildChips(); render(true); };
    el.appendChild(b);
  });
}

// pval(): current cloud cover (k = 0), or the mean over daylight hours (9-17h local) of day k

// a dotted straight line that becomes the real road route (white casing + black line) once routing returns
function routeLine(group, a, b) {
  const straight = L.polyline([a, b], {color: '#111', weight: 2, dashArray: '2 7', lineCap: 'round', interactive: false}).addTo(group);
  return info => {
    if (!info.line || !group.hasLayer(straight)) return;
    group.removeLayer(straight);
    L.polyline(info.line, {color: '#fff', weight: 7, opacity: .95, lineJoin: 'round', interactive: false}).addTo(group);
    L.polyline(info.line, {color: '#111', weight: 3.5, lineJoin: 'round', interactive: false}).addTo(group);
  };
}

// driving distance and time via the public OSRM demo server; falls back to a straight-line estimate
const driveCache = {};
async function drive(a, b) {
  const key = [...a, ...b].map(v => v.toFixed(3)).join();
  if (driveCache[key]) return driveCache[key];
  let info = {km: km(a, b) * 1.3, min: km(a, b) * 1.3 / 65 * 60, est: true};
  try {
    const r = await (await fetch(`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`)).json();
    if (r.routes && r.routes[0]) info = {km: r.routes[0].distance / 1000, min: r.routes[0].duration / 60, est: false,
      line: r.routes[0].geometry ? r.routes[0].geometry.coordinates.map(c => [c[1], c[0]]) : null};
  } catch (e) { /* keep the estimate */ }
  return driveCache[key] = info;
}
const fmtTime = m => m < 60 ? `${Math.max(1, Math.round(m))} min` : `${Math.floor(m / 60)} h ${Math.round(m % 60)} min`;
const fmtDrive = i => `${i.est ? '~' : ''}${Math.round(i.km)} km · ${i.est ? '~' : ''}${fmtTime(i.min)} drive`;
const estimate = d => ({km: d * 1.3, min: d * 1.3 / 65 * 60, est: true});
const sunLine = (best, info, night) => `Nearest sun: ${fmtDrive(info)} (${best.cloud}% cloud there).${night}${staleNote}`;

// ---- city names, from OpenStreetMap via Overpass: biggest first, each with its cloud cover, no overlaps ----
let cities = [], cityKey = '';
async function loadCities() {
  const b = map.getBounds(), z = map.getZoom();
  const kinds = z >= 12 ? 'city|town|village' : z >= 8 ? 'city|town' : 'city';
  const key = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map(v => v.toFixed(1)).join() + kinds;
  if (key === cityKey) return;
  cityKey = key;
  const q = `[out:json][timeout:15];node["place"~"^(${kinds})$"](${b.getSouth().toFixed(3)},${b.getWest().toFixed(3)},${b.getNorth().toFixed(3)},${b.getEast().toFixed(3)});out 120;`;
  try {
    const r = await (await fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(q))).json();
    if (key !== cityKey) return;
    const rank = {city: 3, town: 2, village: 1};
    cities = r.elements.filter(e => e.tags && e.tags.name).map(e => ({
      name: e.tags.name, ll: L.latLng(e.lat, e.lon), rank: rank[e.tags.place] || 0, pop: parseInt(e.tags.population) || 0}))
      .sort((a, c) => c.rank - a.rank || c.pop - a.pop);
    drawCities();
  } catch (e) { /* labels are a bonus; the map works without them */ }
}

function drawCities() {
  cityLayer.clearLayers();
  if (!wx.size) return;
  const size = map.getSize(), taken = [[0, 0, size.x, 96], [0, size.y - 70, size.x, size.y]]; // keep clear of the status card and day bar
  if (me) { const m = map.latLngToContainerPoint(me); taken.push([m.x - 14, m.y - 14, m.x + 14, m.y + 14]); } // and of your own dot
  let n = 0;
  for (const c of cities) {
    if (n >= 14) break;
    const p = map.latLngToContainerPoint(c.ll), w = c.name.length * 6.6 + 78, h = 22;
    const box = [p.x - w / 2, p.y - h / 2, p.x + w / 2, p.y + h / 2];
    if (box[0] < 4 || box[2] > size.x - 4 || box[1] < 4 || box[3] > size.y - 4) continue;
    if (taken.some(t => box[0] < t[2] && box[2] > t[0] && box[1] < t[3] && box[3] > t[1])) continue;
    taken.push(box); n++;
    const cloud = cloudAt(c.ll);
    if (cloud == null) continue;
    const el = document.createElement('div');
    el.className = 'city';
    const sw = document.createElement('i'); sw.className = 'b' + level(cloud);
    const nm = document.createElement('span'); nm.textContent = c.name;
    const pc = document.createElement('b'); pc.textContent = cloud + '%';
    el.append(sw, nm, pc);
    L.marker(c.ll, {interactive: false, keyboard: false, icon: L.divIcon({className: '', iconSize: [0, 0], html: el})}).addTo(cityLayer);
  }
}

let renderId = 0;

function render(animate) {
  const rid = ++renderId;
  layer.clearLayers();
  const data = viewPoints();
  if (!data.length) { say(4, 'No weather here yet', 'Pan or zoom a little, or tap the locate button.'); return; }
  const here = data.reduce((a, b) => km(me, a.pos) < km(me, b.pos) ? a : b);
  let best = null;
  data.forEach(d => {
    d.lv = level(d.cloud); d.dist = km(me, d.pos);
    if (d.cloud <= SUNNY && (!best || d.dist < best.dist)) best = d;
  });
  applySel(animate, () => { drawCities(); showPick(); }); // labels and the tapped spot read the final values
  const when = ['now', 'today', 'tomorrow'][sel] || 'that day';
  const night = sel === 0 && !here.day ? ' It is night there now.' : '';
  let info = null;
  if (best && here.cloud > SUNNY) {
    const showRoute = routeLine(layer, me, best.pos);
    const target = L.circleMarker(best.pos, {radius: 11, color: '#111', weight: 3, fillColor: '#fff', fillOpacity: 1}).addTo(layer);
    info = estimate(best.dist);
    target.bindTooltip(fmtDrive(info), {permanent: true, direction: 'top', offset: [0, -10]});
    drive(me, best.pos).then(i => {
      if (rid !== renderId) return; // the view changed while routing
      showRoute(i);
      target.setTooltipContent(fmtDrive(i));
      const p = statusEl.querySelector('p'); if (p) p.textContent = sunLine(best, i, night);
    });
  }
  L.marker(me, {icon: L.divIcon({className: '', iconSize: [20, 20], iconAnchor: [10, 10], html: '<div class="pin"></div>'}), interactive: false}).addTo(layer);
  if (here.cloud <= SUNNY) say(here.lv, `Sunny ${when}`, `${here.cloud}% cloud at your location.${night}${staleNote}`);
  else if (best) say(here.lv, `${here.cloud}% cloud ${when}`, sunLine(best, info, night));
  else say(here.lv, `${here.cloud}% cloud ${when}`, `No sunny spot in this view. Zoom out or pan to look further.${staleNote}`);
}

function ingest(res, s, pts) {
  (Array.isArray(res) ? res : [res]).forEach((r, k) => {
    const t = r.hourly.time, c = r.hourly.cloud_cover, byDay = {};
    t.forEach((ts, i) => {
      const h = +ts.slice(11, 13);
      if (h >= 9 && h <= 17) (byDay[ts.slice(0, 10)] ||= []).push(c[i]);
    });
    const ds = Object.keys(byDay);
    if (!dayList.length || ds[0] > dayList[0]) dayList = ds;     // the newest list of forecast dates
    wx.set(wkey(s, pts[k][0], pts[k][1]), {now: r.current.cloud_cover, day: r.current.is_day, t: Date.now(),
      daily: ds.map(d => Math.round(byDay[d].reduce((a, b) => a + b) / byDay[d].length))});
  });
}

function saveCache() {
  try { localStorage.setItem('sunWx', JSON.stringify({days: dayList, rows: [...wx].filter(([k]) => fresh(k)).slice(-1500)})); } catch (e) {}
}
try {
  const c = JSON.parse(localStorage.getItem('sunWx') || 'null');
  if (c) { dayList = c.days || []; c.rows.forEach(([k, v]) => wx.set(k, v)); }
} catch (e) {}

async function load() {
  const id = ++loadId, s = stepDeg = pickStep(), b = map.getBounds();
  const need = [];
  for (let i = Math.floor(b.getWest() / s) - 1; i <= Math.ceil(b.getEast() / s) + 1; i++)
    for (let j = Math.max(-80 / s, Math.floor(b.getSouth() / s) - 1); j <= Math.min(80 / s, Math.ceil(b.getNorth() / s) + 1); j++)
      if (!fresh(wkey(s, i, j))) need.push([i, j]);
  if (need.length) {
    if (!viewPoints().length) say(1, 'Checking the sky…', 'Fetching cloud cover for this view.', true);
    try {
      for (let k = 0; k < need.length; k += 80) {
        const chunk = need.slice(k, k + 80);
        const url = 'https://api.open-meteo.com/v1/forecast?current=cloud_cover,is_day&hourly=cloud_cover&forecast_days=7&timezone=auto' +
          '&latitude=' + chunk.map(p => (p[1] * s).toFixed(4)).join(',') + '&longitude=' + chunk.map(p => (p[0] * s).toFixed(4)).join(',');
        const res = await (await fetch(url)).json();
        if (res.error) throw new Error(res.reason);
        ingest(res, s, chunk);
      }
      saveCache();
      staleNote = '';
    } catch (e) {
      if (!viewPoints().length && !wx.size) { if (id === loadId) say(4, 'Could not load weather', e.message); return; }
      staleNote = ' The weather service is busy, so figures may be a little old.';
    }
  }
  if (id !== loadId) return;           // the view moved again; a newer load is in flight
  if (!viewPoints().length) { say(4, 'Could not load weather', 'No data for this view yet. Try again in a few minutes.'); return; }
  buildChips();
  render(false);
  loadCities();
}

// tap anywhere: mark the spot with its cloud cover, plus distance and drive time from you
let pick = null, refreshing = false;
const pickGroup = L.layerGroup().addTo(map);
const cloudAt = ll => { const v = cloudLL(ll.lat, ll.lng); return v == null ? null : Math.round(v); };
const pickHtml = (cloud, info) => `<b>${cloud}% cloud</b><br>${fmtDrive(info)}`;

function showPick() {
  if (!pick || !wx.size || !me) return;
  const at = pick, cloud = cloudAt(at), d = km(me, [at.lat, at.lng]);
  if (cloud == null) return;
  refreshing = true; pickGroup.clearLayers();
  const showRoute = routeLine(pickGroup, me, at);
  const m = L.circleMarker(at, {radius: 9, color: '#111', weight: 3, fillColor: '#fff', fillOpacity: 1}).addTo(pickGroup);
  m.bindPopup(pickHtml(cloud, estimate(d)), {closeButton: false, offset: [0, -4]}).openPopup();
  refreshing = false;
  drive(me, [at.lat, at.lng]).then(info => { if (pick === at) { showRoute(info); m.setPopupContent(pickHtml(cloud, info)); } });
}
map.on('click', e => { pick = e.latlng; showPick(); });
map.on('popupclose', () => { if (!refreshing) { pick = null; pickGroup.clearLayers(); } });

// reload the weather once the user stops panning or zooming
map.on('moveend', () => { if (me) { clearTimeout(timer); timer = setTimeout(load, 700); } });

const locBtn = document.getElementById('locate');
locBtn.innerHTML = ICONS.locate;
// jump back to the user's position (fresh fix) and zoom in on it
locBtn.onclick = () => {
  if (!navigator.geolocation) return;
  locBtn.classList.add('busy');
  navigator.geolocation.getCurrentPosition(
    p => { locBtn.classList.remove('busy'); me = [p.coords.latitude, p.coords.longitude]; map.flyTo(me, 10); },
    () => { locBtn.classList.remove('busy'); if (me) map.flyTo(me, 10); },
    {enableHighAccuracy: true, timeout: 10000, maximumAge: 30000});
};

function locate() {
  say(1, 'Finding you…', 'Allow location access to see the sun near you.', true);
  if (!navigator.geolocation) { say(4, 'No location support', 'This browser cannot share your location.'); return; }
  navigator.geolocation.getCurrentPosition(
    p => { me = [p.coords.latitude, p.coords.longitude]; map.setView(me, 10); },
    e => say(4, 'Location unavailable', e.message),
    {enableHighAccuracy: false, timeout: 15000});
}
locate();
</script>
</body>
</html>
